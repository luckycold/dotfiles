# Let windowed Brave video idle; retain fullscreen video and other app blockers.
# Omarchy's idle plugin is disabled; Sandman still manages lid and sleep actions.
general {
    lock_cmd = omarchy system lock
    after_sleep_cmd = omarchy brightness display on
    ignore_wayland_inhibit = true
    ignore_dbus_inhibit = true
    inhibit_sleep = 0
}

listener {
    timeout = 300
    on-timeout = test -f "$HOME/.local/state/omarchy/indicators/stay-awake" || hyprctl clients -j | jq -e 'any(.[]; .inhibitingIdle and (.fullscreen > 0 or (.class | test("^brave(-origin)?$") | not)))' >/dev/null || omarchy launch screensaver
}

listener {
    timeout = 600
    on-timeout = test -f "$HOME/.local/state/omarchy/indicators/stay-awake" || hyprctl clients -j | jq -e 'any(.[]; .inhibitingIdle and (.fullscreen > 0 or (.class | test("^brave(-origin)?$") | not)))' >/dev/null || omarchy brightness display off
    on-resume = omarchy brightness display on
}

listener {
    timeout = 900
    on-timeout = test -f "$HOME/.local/state/omarchy/indicators/stay-awake" || hyprctl clients -j | jq -e 'any(.[]; .inhibitingIdle and (.fullscreen > 0 or (.class | test("^brave(-origin)?$") | not)))' >/dev/null || omarchy system lock
}
