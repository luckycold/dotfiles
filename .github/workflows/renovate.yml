name: renovate

on:
  workflow_dispatch:
  issues:
    types: [edited]
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:43.150.0
    env:
      LOG_LEVEL: info
      RENOVATE_GIT_AUTHOR: Renovate Bot <renovate@users.noreply.github.com>
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Run Renovate
        run: renovate luckycold/dotfiles
