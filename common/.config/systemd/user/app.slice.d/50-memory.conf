# Cap everything launched as a user app (browsers, Electron apps, user
# services) below physical RAM so a runaway app throttles, then gets killed,
# instead of freezing the whole session. Percentages are of physical RAM
# (24 GiB praxis: ~16.8 GiB high / 18 GiB max). systemd-oomd also watches
# this slice (see /usr/lib/systemd/user/app.slice.d/10-oomd.conf).
[Slice]
MemoryHigh=70%
MemoryMax=75%
