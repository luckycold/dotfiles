# Disable amdgpu Panel Self Refresh (0x10) and Panel Replay (0x400) on the
# Framework 13 Strix eDP panel. With them on, the internal panel can keep
# scanning out a stale frame (e.g. the lock screen after unlocking) until a
# DPMS cycle forces a modeset.
KERNEL_CMDLINE[default]+=" amdgpu.dcdebugmask=0x410"
