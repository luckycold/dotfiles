# The USB4 display tunnel can fail across suspend while docked. Keep the
# session running until all Thunderbolt peripherals are detached. Host
# controllers and retimers have no device_name, so undocked sleep is allowed.
# This also covers explicit sleep requests; lock and display-off still work.
[Unit]
ConditionPathExistsGlob=!/sys/bus/thunderbolt/devices/*/device_name
