# eGPUs (amdgpu over USB4) do not survive hibernation: resuming crashes the
# machine (data fabric sync flood). If a removable GPU is attached when sleep
# starts, suspend without the hibernate timer so undocking while asleep is safe.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'for f in /sys/class/drm/card*/device/removable; do if [ "$$(cat "$$f" 2>/dev/null)" = removable ]; then echo "Removable GPU $$f attached; suspending without hibernation"; exec /usr/lib/systemd/systemd-sleep suspend; fi; done; exec /usr/lib/systemd/systemd-sleep suspend-then-hibernate'
