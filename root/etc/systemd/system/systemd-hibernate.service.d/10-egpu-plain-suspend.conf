# eGPUs (amdgpu over USB4) do not survive hibernation: resuming crashes the
# machine (data fabric sync flood). If a removable GPU is attached, suspend
# instead of hibernating (covers the Omarchy menu and Sandman's lid Hibernate).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'for f in /sys/class/drm/card*/device/removable; do if [ "$$(cat "$$f" 2>/dev/null)" = removable ]; then echo "Removable GPU $$f attached; suspending instead of hibernating"; exec /usr/lib/systemd/systemd-sleep suspend; fi; done; exec /usr/lib/systemd/systemd-sleep hibernate'
