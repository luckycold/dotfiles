# Cap compressed swap at half of RAM, at most 8 GiB. Omarchy's
# 90-omarchy.conf sets zram-size = ram; on the 24 GiB praxis VM that let zram
# compete for the same RAM that ran out (2026-11-20 hang). The disk swapfile
# stays as lower-priority overflow. Sorted after 90-omarchy.conf so it wins.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
